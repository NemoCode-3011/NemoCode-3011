<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://w3.org">
  <defs>
    <!-- Deep Obsidian Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="50%" stop-color="#11131F"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>

    <!-- Subtle Cyber-Violet & Cyan Ambient Glow -->
    <radialGradient id="glow-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 150) rotate(90) scale(220 350)">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 150) rotate(90) scale(200 320)">
      <stop stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Perspective Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Accent Gradient Line -->
    <linearGradient id="accent-line" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow-left)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow-right)"/>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="298" rx="15" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- HUD Corner Brackets (Game UI Touch) -->
  <path d="M 28 52 L 28 28 L 52 28" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 1172 52 L 1172 28 L 1148 28" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 28 248 L 28 272 L 52 272" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 1172 248 L 1172 272 L 1148 272" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Top HUD Status Bar -->
  <circle cx="64" cy="44" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="48" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="2">
    SYS.ONLINE // NEMOCODE-3011
  </text>

  <text x="1136" y="48" text-anchor="end" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1.5">
    [ UI · 3D · SYSTEMS ]
  </text>

  <!-- Main Title -->
  <text x="600" y="148" text-anchor="middle" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="4">
    TEMÍLÁDÉ
  </text>

  <!-- Glowing Divider -->
  <rect x="400" y="170" width="400" height="2" rx="1" fill="url(#accent-line)"/>

  <!-- Subtitle -->
  <text x="600" y="206" text-anchor="middle" fill="#D1D5DB" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" letter-spacing="2.5">
    FULL-STACK DEVELOPER · INTERACTIVE WORLDS &amp; WEB SYSTEMS
  </text>

  <!-- Bottom HUD Metadata -->
  <text x="600" y="256" text-anchor="middle" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1.5">
    STUDIED PEOPLE BEFORE CODE // BUILDING AT TRILOT TECHNOLOGIES
  </text>
</svg>
