<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Temilade — Full-stack Developer</title>
  <desc id="desc">An editorial banner with indigo, warm ivory, terracotta and custom geometric patterns inspired by Yoruba textile design.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#202D43"/><stop offset="1" stop-color="#111A28"/></linearGradient>
    <pattern id="weave" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M36 3L69 36 36 69 3 36Z" fill="none" stroke="#E8D9C2" stroke-opacity=".12" stroke-width="1.2"/>
      <path d="M36 18L54 36 36 54 18 36Z" fill="none" stroke="#C97855" stroke-opacity=".28" stroke-width="1.4"/>
      <circle cx="36" cy="36" r="3" fill="#D9B77E" fill-opacity=".55"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9B77E"/><stop offset="1" stop-color="#C97855"/></linearGradient>
    <clipPath id="panel"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="1200" height="360" fill="url(#paper)"/>
    <rect x="790" y="-100" width="500" height="560" fill="url(#weave)" transform="rotate(8 1040 180)"/>
    <path d="M760 -20L1040 180 760 380" fill="none" stroke="#D9B77E" stroke-opacity=".32" stroke-width="1.5"/>
    <path d="M820 -20L1100 180 820 380" fill="none" stroke="#C97855" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="1000" cy="180" r="126" fill="#C97855" fill-opacity=".12"/>
    <circle cx="1000" cy="180" r="94" fill="none" stroke="#E8D9C2" stroke-opacity=".35"/>
    <path d="M1000 102L1078 180 1000 258 922 180Z" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <path d="M1000 130L1050 180 1000 230 950 180Z" fill="none" stroke="#E8D9C2" stroke-opacity=".75" stroke-width="1.5"/>
    <circle cx="1000" cy="180" r="7" fill="#D9B77E"/>
    <path d="M72 64H116" stroke="#D9B77E" stroke-width="3"/>
    <text x="72" y="96" fill="#D9B77E" font-family="monospace" font-size="12" letter-spacing="3">TEMILADE · NIGERIA</text>
    <text x="66" y="190" fill="#F4EBDD" font-family="Georgia, 'Times New Roman', serif" font-size="82" letter-spacing="-2">Temilade</text>
    <text x="74" y="232" fill="#E8D9C2" font-family="Arial, Helvetica, sans-serif" font-size="21">Full-stack developer</text>
    <text x="74" y="272" fill="#B9C0C9" font-family="Arial, Helvetica, sans-serif" font-size="15">Building thoughtful things for the digital world.</text>
    <path d="M74 309H380" stroke="#C97855" stroke-width="2"/>
    <text x="74" y="334" fill="#B9C0C9" font-family="monospace" font-size="11" letter-spacing="1.7">IDEAS / CRAFT / CURIOSITY</text>
    <text x="1128" y="330" fill="#E8D9C2" fill-opacity=".7" font-family="monospace" font-size="11" text-anchor="end">01 — PERSONAL PROFILE</text>
  </g>
</svg>