      <circle cx="16" cy="37" r="1" fill="#293A63" fill-opacity=".13"/><circle cx="71" cy="82" r="1" fill="#293A63" fill-opacity=".12"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="380" rx="12"/></clipPath>
  </defs>
